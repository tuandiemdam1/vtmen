# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/vtmen
spring.data.mongodb.auto-index-creation=true

# Server
spring.config.import=optional:file:../.env[.properties]
server.port=${BACKEND_PORT:8085}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Vietnamese log lines (Windows console)
logging.charset.console=UTF-8

# Allow bean overriding
spring.main.allow-bean-definition-overriding=true

# Notify the other project's backend (localhost:8085) when an order is created
notify.backend.url=http://localhost:${BACKEND_PORT:8085}/api/orders/notify

# DCS robot send-task (VtMen) — override per environment
vtmen.robot.door-control-url=http://${DCS_HOST:localhost}:${DCS_PORT:8081}/task/interface/cabinetMissionOpen
vtmen.robot.dispatch-url=http://${DCS_HOST:localhost}:${DCS_PORT:8081}/api/task/interface/createTaskAndBegin
vtmen.robot.default-robot-id=Robot_1
vtmen.robot.default-capacity-resource-name=B1B-A-277
vtmen.robot.default-site-id=1919572875325743104
# ASCII-safe Unicode (avoids corrupt .properties load on some editors)
vtmen.robot.default-destination-name=\u0110\u1ea1i h\u1ecdc Th\u1ee7y L\u1ee3i

# DCS map points (GET with current, size, siteId)
vtmen.dcs.locations-url=http://${DCS_HOST:localhost}:${DCS_PORT:8081}/task/interface/getParkPointPage
vtmen.dcs.map-name=Trường đại học
# Set true to fetch locations on boot and rewrite all orders' destinationName + address to DCS pairs
vtmen.dcs.sync-orders-on-startup=false